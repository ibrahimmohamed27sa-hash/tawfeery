<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="goldlite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Trophy Cup -->
  <!-- Bowl -->
  <path d="M200,180 Q256,370 256,370 Q256,370 312,180 Z" fill="url(#gold)" opacity="0.95"/>
  <!-- Bowl rim highlight -->
  <ellipse cx="256" cy="178" rx="62" ry="12" fill="url(#goldlite)"/>
  <!-- Bowl inner shadow -->
  <path d="M210,195 Q256,340 256,340 Q256,340 302,195 Z" fill="rgba(255,255,255,0.15)"/>

  <!-- Handles -->
  <path d="M195,200 Q150,240 168,280" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
  <path d="M317,200 Q362,240 344,280" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>

  <!-- Base -->
  <rect x="220" y="370" width="72" height="20" rx="6" fill="url(#gold)"/>
  <rect x="200" y="385" width="112" height="16" rx="8" fill="url(#gold)"/>

  <!-- Star of excellence on the cup -->
  <polygon points="256,210 264,228 284,230 269,244 272,264 256,254 240,264 243,244 228,230 248,228" fill="#fff" opacity="0.9"/>

  <!-- "أفضل سعر" badge ribbon -->
  <g transform="translate(350, 80)">
    <path d="M0,0 L95,0 L85,30 L95,60 L0,60 L10,30 Z" fill="url(#gold)" opacity="0.92"/>
    <text x="47" y="22" text-anchor="middle" font-family="'Tajawal', sans-serif" font-size="16" font-weight="700" fill="#78350f">أفضل</text>
    <text x="47" y="46" text-anchor="middle" font-family="'Tajawal', sans-serif" font-size="16" font-weight="700" fill="#78350f">سعر</text>
  </g>

  <!-- Subtle confetti/sparkle dots -->
  <circle cx="130" cy="140" r="5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="380" cy="180" r="4" fill="#fbbf24" opacity="0.5"/>
  <circle cx="160" cy="300" r="3" fill="#34d399" opacity="0.4"/>
  <circle cx="370" cy="310" r="4" fill="#34d399" opacity="0.4"/>

  <!-- "توفيري" label at bottom -->
  <text x="256" y="460" text-anchor="middle" font-family="'Tajawal', 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="rgba(255,255,255,0.25)" letter-spacing="2">توفيري</text>
</svg>
