<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Hexagonal shield -->
  <polygon points="256,50 450,150 450,350 256,462 62,350 62,150" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <!-- Medical cross symbol -->
  <rect x="216" y="130" width="80" height="252" rx="16" fill="url(#cross)" opacity="0.95"/>
  <rect x="130" y="216" width="252" height="80" rx="16" fill="url(#cross)" opacity="0.95"/>
  <!-- Small price tag / discount badge -->
  <g transform="translate(380, 110)">
    <rect x="0" y="0" width="90" height="36" rx="18" fill="#f59e0b" opacity="0.9"/>
    <text x="45" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fff">توفير</text>
  </g>
  <!-- "T" letter at bottom -->
  <text x="256" y="440" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="rgba(255,255,255,0.3)" letter-spacing="4">TAWFEERY</text>
</svg>
